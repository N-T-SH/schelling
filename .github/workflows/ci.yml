name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --extra dev --extra train
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src/
      - run: uv run pytest -m "not slow and not gpu and not network" -q --cov --cov-fail-under=85
      - name: JSON Schema snapshot is current
        run: uv run python scripts/export_schemas.py && git diff --exit-code schemas/
