[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schelling"
version = "0.0.0"
description = "Predicts the distribution of human answers to typed questions, for realistic population simulation."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "lightgbm>=4.7.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
train = ["torch>=2.3", "transformers>=4.45", "safetensors>=0.4", "datasets>=2.20", "tensorboard>=2.16"]
api-baselines = ["httpx>=0.27"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML",
    "pandas-stubs",
]

[project.scripts]
schelling = "schelling.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/schelling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --ignore=tests/gbm"
markers = [
    "unit: fast isolated tests",
    "property: Hypothesis property tests",
    "integration: multi-component tests on fixtures",
    "slow: regression and golden-metric tests",
    "gpu: needs a GPU",
    "network: needs network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # the formatter wraps code; long report strings stay readable

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.coverage.run]
source = ["src/schelling"]
omit = ["src/schelling/baselines/jev_api.py", "src/schelling/baselines/llm_prompt.py"]

[dependency-groups]
dev = [
    "scipy-stubs>=1.17.1.5",
    "types-pyyaml>=6.0.12.20260906",
]

# transformers ships partial type information; keep strict everywhere else.
[[tool.mypy.overrides]]
module = ["schelling.model.*", "schelling.infer.*", "schelling.train.*"]
disallow_untyped_calls = false
warn_return_any = false
disallow_subclassing_any = false

# On Linux (CI) take the CPU-only PyTorch wheels: the default ones pull about 2 GB of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
